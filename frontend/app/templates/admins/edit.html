{% extends "base.html" %}

{% block title %}Edit Admin - Admin Management{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-pencil"></i> Edit Admin #{{ admin_id }}</h5>
            </div>
            <div class="card-body">
                <form id="editAdminForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email">
                        <div class="form-text">Leave empty to keep current email</div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="password" name="password">
                        <div class="form-text">Leave empty to keep current password</div>
                    </div>

                    <div class="mb-3">
                        <label for="enabled" class="form-label">Status</label>
                        <select class="form-select" id="enabled" name="enabled">
                            <option value="">Keep current</option>
                            <option value="true">Enabled</option>
                            <option value="false">Disabled</option>
                        </select>
                    </div>

                    <div class="alert alert-danger d-none" id="errorAlert"></div>
                    <div class="alert alert-success d-none" id="successAlert"></div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/admins" class="btn btn-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <span id="submitSpinner" class="spinner-border spinner-border-sm d-none"></span>
                            Update Admin
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/admin.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
    // Load admin data
    const adminId = {{ admin_id }};
    const admin = await getAdmin(adminId);

    if (admin) {
        // Pre-fill form with current values as placeholders
        document.getElementById('email').placeholder = admin.email;
    }
});

document.getElementById('editAdminForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const form = e.target;
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('submitSpinner');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');

    // Show loading
    submitBtn.disabled = true;
    spinner.classList.remove('d-none');
    errorAlert.classList.add('d-none');
    successAlert.classList.add('d-none');

    // Prepare data - only include fields with values
    const adminData = {};

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const enabled = document.getElementById('enabled').value;

    if (email) adminData.email = email;
    if (password) adminData.password = password;
    if (enabled !== '') adminData.enabled = enabled === 'true';

    try {
        const adminId = {{ admin_id }};
        const response = await updateAdmin(adminId, adminData);

        if (response.ok) {
            successAlert.textContent = 'Admin updated successfully!';
            successAlert.classList.remove('d-none');

            // Reload admin data
            const admin = await getAdmin(adminId);
            if (admin) {
                document.getElementById('email').placeholder = admin.email;
                // Clear input fields
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            }
        } else {
            const errorData = await response.json();
            errorAlert.textContent = errorData.detail || 'Failed to update admin';
            errorAlert.classList.remove('d-none');
        }
    } catch (error) {
        errorAlert.textContent = 'Network error. Please try again.';
        errorAlert.classList.remove('d-none');
    } finally {
        submitBtn.disabled = false;
        spinner.classList.add('d-none');
    }
});
</script>
{% endblock %}
