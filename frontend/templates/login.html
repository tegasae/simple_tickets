<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="theme-onec login-page">
    <main class="login-shell">
        <section class="login-card panel">
            <div class="login-brand">
                <div class="brand-mark">ST</div>
                <div>
                    <h1>Simple Tickets</h1>
                    <p>Административный вход</p>
                </div>
            </div>

            <form id="loginForm" class="form-stack">
                <label>
                    <span>Логин</span>
                    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
                </label>

                <label>
                    <span>Пароль</span>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </label>

                <label>
                    <span>Интерфейс</span>
                    <select id="themeSelect">
                        <option value="onec">1С 8.3</option>
                        <option value="classic">Классический web</option>
                        <option value="futuristic">Футуристический</option>
                    </select>
                </label>

                <button class="primary full" type="submit">Войти</button>
                <div id="loginStatus" class="status-line"></div>
            </form>
        </section>
    </main>

    <script src="/static/js/login.js"></script>
</body>
</html>
